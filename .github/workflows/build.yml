name: Build AppImage

# Only runs when a release is published on GitHub.
on:
  release:
    types: [published]

permissions:
  contents: write   # needed to attach the AppImage to the release

jobs:
  appimage:
    runs-on: ubuntu-22.04   # older glibc => the AppImage runs on more distributions
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libclang-dev curl fontconfig fonts-noto-core

      - name: Build AppImage
        run: ./build-appimage.sh

      - name: Attach AppImage to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=(RustArc-*-x86_64.AppImage)
          sha256sum "$asset" > "${asset}.sha256"
          gh release upload "${{ github.event.release.tag_name }}" "$asset" "${asset}.sha256" --clobber
